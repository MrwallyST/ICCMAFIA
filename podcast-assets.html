<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast & Substack Assets — ICCMAFIA-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090e;
            --surface: #11131a;
            --surface2: #1a1d27;
            --border: rgba(255,255,255,0.06);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent2: #a855f7;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --gold: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

        header { padding: 30px; text-align: center; border-bottom: 1px solid var(--border); background: var(--surface); }
        h1 { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 900; background: linear-gradient(135deg, var(--text), var(--muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-link { display: inline-block; margin-bottom: 16px; color: var(--muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .back-link:hover { color: var(--text); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        .generator-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        
        .presets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
        .preset-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .preset-btn:hover, .preset-btn.active { background: rgba(99,102,241,0.15); border-color: var(--accent); color: #fff; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border 0.2s; }
        input:focus, textarea:focus { border-color: var(--accent); }
        
        button.generate-btn { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; font-family: 'Outfit', sans-serif; margin-top: 10px; }
        button.generate-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--accent-glow); }

        .output-section { margin-top: 32px; display: none; }
        .output-box { background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 24px; font-family: monospace; font-size: 14px; line-height: 1.6; color: #a5b4fc; white-space: pre-wrap; margin-bottom: 16px; max-height: 400px; overflow-y: auto; }
        .copy-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .copy-btn:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <h1>🎙️ Podcast & Substack Generator</h1>
    <p style="color:var(--muted); font-size:14px; margin-top:8px;">Generate perfectly formatted assets for Audio, Substack, and Reddit.</p>
</header>

<div class="container">
    <div class="generator-card">
        <label>Load Course Preset</label>
        <div class="presets" id="presets-container"></div>

        <div class="input-group">
            <label>Episode / Day Title</label>
            <input type="text" id="p-title" placeholder="e.g. Day 1: The Correlation Problem">
        </div>
        <div class="input-group">
            <label>Core Topic</label>
            <input type="text" id="p-topic" placeholder="e.g. Why one timeframe can create confusion...">
        </div>
        <div class="input-group">
            <label>Key Takeaways (Comma separated)</label>
            <textarea id="p-bullets" rows="3" placeholder="e.g. Higher-timeframe context, Correlation vs Confirmation, Clean reviews"></textarea>
        </div>

        <button class="generate-btn" onclick="generateAssets()">⚡ Generate Assets</button>

        <div class="output-section" id="output-section">
            <label>Generated Content Pack</label>
            <div class="output-box" id="output-box"></div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
            <button class="copy-btn" onclick="downloadMd()" style="margin-left: 10px;">💾 Download .md</button>
        </div>
    </div>
</div>

<script>
    const presets = [
        { id: 1, title: "Day 1: The Correlation Problem", topic: "Why one chart can confuse your trading without higher-timeframe context.", bullets: "Why one timeframe can create confusion, How higher-timeframe context helps, Why correlation is not the same as confirmation" },
        { id: 2, title: "Day 2: HTF Compass", topic: "Using the higher timeframe as the directional compass.", bullets: "Reviewing HTF Compass, The higher timeframe gives directional context, Journaling questions for this setup" },
        { id: 3, title: "Day 3: LTF Microscope", topic: "Using the lower timeframe for precision without letting it override higher-timeframe context.", bullets: "Reviewing LTF Microscope, The lower timeframe helps refine execution, Don't let LTF override the big picture" },
        { id: 4, title: "Day 4: Aligning for Entry", topic: "Waiting for the trading idea to align before taking an entry.", bullets: "Reviewing Aligning for Entry, Entry should happen after alignment, Not because of impatience" },
        { id: 5, title: "Day 5: Setting Your Target", topic: "Understanding target selection, trade planning, and avoiding random exits.", bullets: "Reviewing Setting Your Target, Targets should be planned with structure, Avoiding emotional exits" },
        { id: 6, title: "Day 6: How 3 Timeframes Fixed My Entries", topic: "HTF bias, mid-timeframe correction, and LTF entry timing.", bullets: "The Three-Tier Hierarchy, The Traffic Light System, Confluence pointing to the same price level" }
    ];

    function renderPresets() {
        const container = document.getElementById('presets-container');
        presets.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn';
            btn.textContent = `Day ${p.id}`;
            btn.onclick = () => {
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('p-title').value = p.title;
                document.getElementById('p-topic').value = p.topic;
                document.getElementById('p-bullets').value = p.bullets;
            };
            container.appendChild(btn);
        });
    }

    function generateAssets() {
        const title = document.getElementById('p-title').value || 'Untitled Episode';
        const topic = document.getElementById('p-topic').value || 'Trading concepts.';
        const bulletsRaw = document.getElementById('p-bullets').value || 'No specific bullets provided.';
        const bullets = bulletsRaw.split(',').map(b => `- ${b.trim()}`).join('\n');

        const out = `# 🎙️ Podcast & Substack Pack

## Podcast Title
${title}

## Substack Title
${topic}

## Show Notes
${bullets}
- What to journal after reviewing a setup
- Free tools at ICCMAFIA-AI

## Substack Intro
“This episode is all about ${topic}. The point of this lesson is simple: ${bulletsRaw.split(',')[0] || topic}. This post breaks down how I’m studying these concepts inside the free ICCMAFIA-AI system.”

## Full Substack Post
The goal is not signals, the goal is process. I'm studying how to wait for the Indication, Correction, and Continuation sequence to play out across the right timeframes. Without a solid map, it's just noise.

## Reddit Post (r/Daytrading / r/Forex)
**Title:** ${title} - ${topic}
**Body:** 
I've been journaling my progress using the Indication-Correction-Continuation framework. One of the biggest lessons so far: ${topic}.

${bullets}

I put together my full study notes and a podcast overview on this. Everything is totally free and ad-free. Anyone else mapping their timeframe alignment like this?

## Journal Prompts
- What timeframe was I focused on?
- Did I check higher-timeframe context?
- Was my bias based on structure or emotion?

---
*Disclaimer: Educational only. Not financial advice. We do not provide signals. Trading involves risk.*`;

        const box = document.getElementById('output-box');
        box.textContent = out;
        document.getElementById('output-section').style.display = 'block';
    }

    function copyToClipboard() {
        const text = document.getElementById('output-box').textContent;
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
    }

    function downloadMd() {
        const text = document.getElementById('output-box').textContent;
        const blob = new Blob([text], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Podcast_Assets_${document.getElementById('p-title').value.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    renderPresets();
</script>
</body>
</html>
