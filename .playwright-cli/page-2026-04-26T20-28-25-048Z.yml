        - generic [ref=e142]: "ICC means Indication, Correction, Continuation. Indication: price shows intent by breaking/sweeping a meaningful level. Correction: price pulls back and tests traders who chased. Continuation: price confirms it wants to keep moving in the original direction. The biggest rule is not chasing the first move."
        - button "📋 Copy Starter" [ref=e143] [cursor=pointer]
