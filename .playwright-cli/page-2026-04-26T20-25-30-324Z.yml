          - generic [ref=e141]: Short answer
        - generic [ref=e142]: "ICC means Indication, Correction, Continuation. Indication: price shows intent by breaking/sweeping a meaningful level. Correction: price pulls back and tests traders who chased. Continuation: price confirms it wants to keep moving in the original direction. The biggest rule is not chasing the first move."
        - button "📋 Copy Starter" [ref=e143] [cursor=pointer]
      - generic [ref=e144]:
        - generic [ref=e146]:
          - generic [ref=e147]: Reply to What is ICC?
          - generic [ref=e148]: Beginner-friendly answer
        - generic [ref=e149]: "Think of ICC like a 3-step trade filter: 1. Did price make a real move? That is indication. 2. Did it pull back instead of letting everyone win instantly? That is correction. 3. Did it prove the move is continuing? That is continuation. It keeps you from buying the breakout just because candles are moving fast."
